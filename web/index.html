<title>Agloe Renderer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root{--bg:#f6f4ef;--fg:#1d1b18;--muted:#6b665d;--card:#fff;--line:#ddd7cc;--accent:#d9572b;--accent-fg:#fff;--err:#b3261e}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#141311;--fg:#f1ede6;--muted:#a59f94;--card:#1e1c19;--line:#34302a;--accent:#f07a4a;--accent-fg:#141311;--err:#ff8a80}}
:root[data-theme="dark"]{--bg:#141311;--fg:#f1ede6;--muted:#a59f94;--card:#1e1c19;--line:#34302a;--accent:#f07a4a;--accent-fg:#141311;--err:#ff8a80}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:560px;margin:0 auto;padding-block:16px calc(24px + env(safe-area-inset-bottom));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-size:22px;margin:4px 0 2px}.sub{margin:0 0 14px;color:var(--muted);font-size:14px}
.field{display:flex;flex-direction:column;gap:6px;margin:12px 0}.field span{font-size:13px;color:var(--muted);font-weight:600}
input,select{font:inherit;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg)}
.stage{background:#000;border-radius:12px;overflow:hidden;margin:12px auto}
.stage.port{aspect-ratio:9/16;width:min(100%,calc(62vh*9/16))}.stage.land{aspect-ratio:16/9;width:100%}
.buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
button{font:inherit;font-weight:600;padding:14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg)}
button.primary{background:var(--accent);color:var(--accent-fg);border-color:transparent}
button.ghost{background:transparent;padding:8px 12px;margin-top:8px}
button:disabled{opacity:.5}
.status{margin-top:14px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.bar{height:8px;border-radius:4px;background:var(--line);margin-top:8px;overflow:hidden}.bar div{height:100%;background:var(--accent);transition:width .2s}
button.wide{width:100%;margin:4px 0 0}
.error{margin-top:14px;color:var(--err);font-size:14px;word-break:break-word}
.result{margin-top:16px;display:flex;flex-direction:column;gap:10px}.result img,.result video{width:100%;border-radius:12px;background:#000}
footer{margin-top:24px;font-size:12px;color:var(--muted)}
</style>

<div id="root"></div>
<script src="app.js"></script>
